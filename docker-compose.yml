services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: research
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  app:
    build: .
    depends_on:
      - postgres
    ports:
      - "8501:8501"
    env_file: .env
    volumes:
      - ".:/app"
    command: streamlit run src/app.py --server.address 0.0.0.0

volumes:
  pgdata:
