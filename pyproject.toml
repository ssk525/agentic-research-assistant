[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-research-assistant"
version = "1.0.0"
description = "Multi-agent research assistant (Planner -> Worker -> Critic) on LangGraph with RAG, SQL, and web tools."
requires-python = ">=3.11"

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-v"
